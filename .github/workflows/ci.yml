name: CI — Build and Push Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/frontend-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build check
        run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          IMAGE_TAG=$(date -u '+%Y%m%d-%H%M')
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Tag: ${IMAGE_TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update image tag in infra-code repo
        env:
          INFRA_CODE_TOKEN: ${{ secrets.INFRA_CODE_TOKEN }}
        run: |
          IMAGE_TAG="${{ steps.tag.outputs.IMAGE_TAG }}"
          echo "Updating infra-code with image tag: ${IMAGE_TAG}"

          git clone https://x-access-token:${INFRA_CODE_TOKEN}@github.com/emadrasooli/infra-code.git
          cd infra-code

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cd apps/frontend/overlays/dev
          sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|" kustomization.yaml

          cd ../../../../
          git add apps/frontend/overlays/dev/kustomization.yaml
          git commit -m "ci: update frontend-app image tag to ${IMAGE_TAG}

          Triggered by: ${{ github.sha }}"

          git push origin main
          echo "✅ infra-code updated with tag ${IMAGE_TAG}"
